<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - Photo With Mehran</title>
  <meta name="description" content="Browse the photography portfolio of Mehran Bazrafkan — portraits, street, landscape, nature and more." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Shared site styles -->
  <link rel="stylesheet" href="css/shared.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            ink: '#0f0f12',
            cream: '#f7f5f2',
          },
        },
      },
    };
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }

    /* Fade-in on scroll */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    ::selection { background: #c9a96a; color: #fff; }

    #landing-view, #category-view { flex: 1; }
  </style>
</head>

<body class="bg-cream text-ink antialiased" data-page="portfolio">

  <script>
    // Let the shared navigation know which category is open, so the
    // Portfolio dropdown can highlight it. Runs before js/shared.js.
    (function () {
      try {
        var cat = new URLSearchParams(window.location.search).get('cat');
        if (cat) document.body.setAttribute('data-category', cat);
      } catch (e) { /* ignore malformed query */ }
    })();
  </script>

  <!-- Portfolio landing (category overview) -->
  <div id="landing-view">
    <section class="mx-auto max-w-6xl px-6 pt-32 pb-14 text-center sm:pt-36">
      <p class="mb-3 text-sm font-medium uppercase tracking-[0.3em] text-amber-600">Portfolio</p>
      <h1 class="font-serif text-4xl font-semibold leading-tight sm:text-5xl">Selected Work</h1>
      <p class="mx-auto mt-4 max-w-xl text-sm leading-relaxed text-ink/60 sm:text-base">
        A gallery of photographs organised by category. Click a category to browse the full collection.
      </p>
    </section>

    <section class="mx-auto max-w-6xl px-6 pb-24">
      <div id="category-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <!-- category cards injected by js/portfolio.js -->
      </div>
      <p id="category-empty" class="hidden py-16 text-center text-sm text-ink/50">
        No photography categories have been added yet.
      </p>
    </section>
  </div>

  <!-- Individual category gallery -->
  <div id="category-view" class="hidden">
    <section class="mx-auto max-w-6xl px-6 pt-28 text-center sm:pt-32">
      <a href="portfolio.html" class="mb-6 inline-flex items-center gap-2 text-xs font-medium text-ink/50 transition hover:text-amber-600">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        Back to portfolio
      </a>
      <p class="mb-2 text-sm font-medium uppercase tracking-[0.25em] text-amber-600">Portfolio</p>
      <h1 id="category-name" class="font-serif text-4xl font-semibold sm:text-5xl"></h1>
      <p id="category-description" class="mx-auto mt-3 max-w-xl text-sm leading-relaxed text-ink/60 sm:text-base"></p>
      <p id="category-count" class="mt-3 text-xs font-medium uppercase tracking-[0.2em] text-ink/40"></p>
    </section>

    <section class="mx-auto max-w-6xl px-6 py-12 sm:py-16">
      <div id="photo-grid" class="grid grid-cols-2 gap-3 sm:gap-4 md:grid-cols-3 lg:grid-cols-4">
        <!-- thumbnails injected by js/portfolio.js -->
      </div>
      <p id="category-empty-gallery" class="hidden py-16 text-center text-sm text-ink/50">
        This category has no photos yet.
      </p>
    </section>
  </div>

  <!-- ====================== FOOTER ====================== -->
  <footer class="bg-ink py-8 text-center text-sm text-cream/50">
    <p class="font-serif text-base text-cream/80">Mehran Bazrafkan</p>
    <p class="mt-1">Photographer · © <span id="year"></span> · All rights reserved</p>
  </footer>

  <!-- ====================== PHOTO VIEWER ====================== -->
  <div id="photo-viewer" class="photo-viewer" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button type="button" id="pv-close" class="photo-viewer__close" aria-label="Close">&times;</button>
    <button type="button" id="pv-prev" class="photo-viewer__prev" aria-label="Previous photo">&#8249;</button>
    <img id="pv-img" class="photo-viewer__img" src="" alt="" />
    <button type="button" id="pv-next" class="photo-viewer__next" aria-label="Next photo">&#8250;</button>
    <span id="pv-count" class="photo-viewer__count"></span>
  </div>

  <!-- ====================== SCRIPTS ====================== -->
  <script src="js/portfolio-data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/portfolio.js"></script>
</body>
</html>
